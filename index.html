<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manyetik-His: Kutupların Savaşı</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu-screen" class="screen">
  <h1>MANYETİK-HİS</h1>
  <h2>Kutupların Savaşı</h2>

  <button class="big-btn" id="btn-level1">SEVİYE 1 — Tek Oyunculu (Zamana Karşı)</button>

  <h3>SEVİYE 2 — Çok Oyunculu</h3>
  <div class="player-count-row">
    <span>Oyuncu sayısı:</span>
    <label><input type="radio" name="pcount" value="2" checked> 2</label>
    <label><input type="radio" name="pcount" value="3"> 3</label>
    <label><input type="radio" name="pcount" value="4"> 4</label>
  </div>
  <div id="name-inputs"></div>
  <button class="big-btn" id="btn-level2">Oyunu Başlat</button>
  <button class="link-btn" id="btn-leaders">🏆 Skor Tablosu</button>
  <button class="link-btn" id="btn-help">Nasıl oynanır?</button>
</div>

<div id="game-screen" class="screen" style="display:none">
  <div class="game-layout">
    <div class="board-wrap">
      <div id="board-grid" class="board-grid"></div>
    </div>
    <div class="side-panel">
      <div id="lbl-title" class="lbl-title"></div>
      <div id="lbl-turn" class="lbl-turn"></div>
      <div id="lbl-info" class="lbl-info"></div>

      <div class="box">
        <div class="box-title">Ne yapacaksın?</div>
        <label class="radio-row"><input type="radio" name="mode" value="test" checked> Test et</label>
        <div id="tool-choice" class="indent"></div>
        <label class="radio-row"><input type="radio" name="mode" value="flag"> Bayrak dik</label>
        <div class="indent flag-row">
          <label><input type="radio" name="flagsym" value="N" checked> N</label>
          <label><input type="radio" name="flagsym" value="S"> S</label>
          <label><input type="radio" name="flagsym" value="Fe"> Fe</label>
          <label><input type="radio" name="flagsym" value="Cu"> Cu</label>
        </div>
        <label class="radio-row" id="unflag-row" style="display:none"><input type="radio" name="mode" value="unflag"> Bayrağı kaldır</label>
      </div>

      <label class="chk-row">
        <input type="checkbox" id="chk-history" checked>
        Test geçmişini karelerde göster (hafıza yardımı)
      </label>

      <div id="lbl-msg" class="lbl-msg">Bir kareyi test et.</div>

      <button id="btn-end-turn" class="big-btn" style="display:none">Turu Bitir / Pas Geç</button>

      <div id="lbl-score" class="lbl-score"></div>

      <button class="link-btn" id="btn-menu">Menüye dön</button>
    </div>
  </div>
</div>

<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div id="modal-title" class="modal-title"></div>
    <div id="modal-body" class="modal-body"></div>
    <button id="modal-close" class="big-btn">Kapat</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
